<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日本 — 地方中枢都市から広がる光</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;background:transparent}
svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes ripple{0%{transform:scale(.35);opacity:.5}100%{transform:scale(2.6);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ripple 4.4s cubic-bezier(.22,.61,.36,1) infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe 5.6s ease-in-out infinite}
</style>
</head>
<body>
<svg id="map" viewBox="0 0 700 800" preserveAspectRatio="xMidYMid meet" aria-label="日本地図：地方中枢都市から地域へ広がる光"></svg>
<script>
const ACCENT = '#3B82C4';
const CITIES = [
  { jp: '札幌', en: 'SAPPORO', lon: 141.354, lat: 43.062, dx: 62, dy: -34, key: false },
  { jp: '仙台', en: 'SENDAI', lon: 140.872, lat: 38.268, dx: 70, dy: -6, key: false },
  { jp: '名古屋', en: 'NAGOYA', lon: 136.906, lat: 35.181, dx: 86, dy: 78, key: true },
  { jp: '大阪', en: 'OSAKA', lon: 135.502, lat: 34.694, dx: -74, dy: -54, key: false },
  { jp: '広島', en: 'HIROSHIMA', lon: 132.459, lat: 34.386, dx: -66, dy: 66, key: false },
  { jp: '福岡', en: 'FUKUOKA', lon: 130.402, lat: 33.590, dx: -78, dy: -44, key: false }
];
const TOKYO = { jp: '東京', en: 'TOKYO', lon: 139.692, lat: 35.690 };

const svg = d3.select('#map');
const defs = svg.append('defs');
const grad = (id, stop) => {
  const g = defs.append('radialGradient').attr('id', id);
  g.append('stop').attr('offset', '0%').attr('stop-color', ACCENT).attr('stop-opacity', stop);
  g.append('stop').attr('offset', '45%').attr('stop-color', ACCENT).attr('stop-opacity', stop * 0.42);
  g.append('stop').attr('offset', '100%').attr('stop-color', ACCENT).attr('stop-opacity', 0);
};
grad('glowKey', 0.72);
grad('glow', 0.44);

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const countries = topojson.feature(topo, topo.objects.countries);
  const japan = countries.features.find(f => f.properties && f.properties.name === 'Japan');
  if (!japan) return;

  const projection = d3.geoMercator().fitExtent([[178, 56], [566, 744]], japan);
  const path = d3.geoPath(projection);

  svg.append('path').attr('d', path(japan))
    .attr('fill', 'rgba(21,21,21,.055)')
    .attr('stroke', 'rgba(21,21,21,.26)')
    .attr('stroke-width', 1.6);

  const at = c => projection([c.lon, c.lat]);

  // glow spreading from each regional hub into its surrounding region
  const glows = svg.append('g');
  CITIES.forEach((c, i) => {
    const p = at(c);
    const r = c.key ? 112 : 62;
    glows.append('circle').attr('class', 'glow')
      .attr('cx', p[0]).attr('cy', p[1]).attr('r', r)
      .attr('fill', c.key ? 'url(#glowKey)' : 'url(#glow)')
      .style('animation-delay', (i * 0.8) + 's');
  });

  // Tokyo — present, but not the source of the light
  const tp = at(TOKYO);
  const tokyo = svg.append('g');
  tokyo.append('circle').attr('cx', tp[0]).attr('cy', tp[1]).attr('r', 5)
    .attr('fill', 'none').attr('stroke', 'rgba(21,21,21,.45)').attr('stroke-width', 1.6);
  tokyo.append('line').attr('x1', tp[0] + 10).attr('y1', tp[1] - 5).attr('x2', tp[0] + 30).attr('y2', tp[1] - 25)
    .attr('stroke', 'rgba(21,21,21,.28)').attr('stroke-width', 1);
  tokyo.append('text').attr('x', tp[0] + 35).attr('y', tp[1] - 26)
    .attr('font-family', "'IBM Plex Mono',monospace").attr('font-size', 20)
    .attr('letter-spacing', '.14em').attr('fill', 'rgba(21,21,21,.4)').text('TOKYO');

  const marks = svg.append('g');
  CITIES.forEach((c, i) => {
    const p = at(c);
    const g = marks.append('g');
    [0, 1.6].forEach(d => {
      g.append('circle').attr('class', 'ring')
        .attr('cx', p[0]).attr('cy', p[1]).attr('r', c.key ? 44 : 30)
        .attr('fill', 'none').attr('stroke', ACCENT)
        .attr('stroke-width', c.key ? 2 : 1.5)
        .style('animation-delay', (i * 0.55 + d) + 's');
    });
    g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', c.key ? 11 : 6.5)
      .attr('fill', c.key ? '#FFFDF5' : ACCENT)
      .attr('stroke', ACCENT).attr('stroke-width', c.key ? 5 : 0);

    const dir = c.dx > 0 ? 1 : -1;
    const lx = p[0] + c.dx;
    const ly = p[1] + c.dy;
    const anchor = dir > 0 ? 'start' : 'end';
    const len = Math.hypot(c.dx, c.dy);
    const gap = c.key ? 24 : 17;
    g.append('line')
      .attr('x1', p[0] + (c.dx / len) * gap).attr('y1', p[1] + (c.dy / len) * gap)
      .attr('x2', lx - dir * 8).attr('y2', ly)
      .attr('stroke', c.key ? ACCENT : 'rgba(21,21,21,.28)').attr('stroke-width', 1);
    g.append('text').attr('x', lx).attr('y', ly - 6).attr('text-anchor', anchor)
      .attr('font-family', "'Zen Kaku Gothic New',sans-serif")
      .attr('font-size', c.key ? 34 : 24)
      .attr('font-weight', c.key ? 700 : 500)
      .attr('fill', c.key ? '#151515' : 'rgba(21,21,21,.72)')
      .text(c.jp);
    g.append('text').attr('x', lx).attr('y', ly + (c.key ? 26 : 22)).attr('text-anchor', anchor)
      .attr('font-family', "'IBM Plex Mono',monospace")
      .attr('font-size', c.key ? 21 : 20)
      .attr('letter-spacing', '.16em')
      .attr('fill', c.key ? ACCENT : 'rgba(21,21,21,.5)')
      .text(c.en);
  });
});
</script>
</body>
</html>
