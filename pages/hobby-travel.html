<style>

  .city{fill:#3E3323;stroke:#F0E4C6;stroke-width:.9;cursor:pointer}
  .citylab{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:13px;letter-spacing:.05em;fill:#4A3A24;pointer-events:none}
  .pref{fill:#B4573F;stroke:#F0E4C6;stroke-width:1}
  .prefArea{stroke:#8B6F45;stroke-width:.75;stroke-dasharray:3 2.6;opacity:.85;pointer-events:none}

  .frame{position:absolute;inset:14px;border:2px solid #6E5535;pointer-events:none}

  .corner{position:absolute;width:66px;height:66px;pointer-events:none}

  .banner{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:560px;text-align:center;pointer-events:none}
  .btitle{font-family:'IM Fell English SC',serif;font-size:36px;letter-spacing:.1em;color:#3B2C18;margin:0;line-height:1}
  .bsub{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:14px;letter-spacing:.3em;color:#5A4626;margin:9px 0 0}

  .flags{position:absolute;left:50%;top:122px;transform:translateX(-50%);display:flex;align-items:center;gap:9px}
  .flagbtn{width:36px;height:27px;padding:0;border:1px solid #6E5535;background:#F0E4C6;cursor:pointer;display:block;overflow:hidden;box-shadow:0 2px 4px rgba(90,64,30,.28);transition:transform .25s ease,box-shadow .25s ease}
  .flagbtn:hover{transform:translateY(-3px);box-shadow:0 7px 11px rgba(90,64,30,.34)}
  .flagbtn img{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.16) saturate(.9) contrast(.97)}

  .slotcard{position:absolute;width:232px;pointer-events:auto}
  .slotcard .ph{display:block;width:100%;height:155px;object-fit:contain;
    mix-blend-mode:multiply;

  .legend .row + .row{margin-top:11px}
  .sw{width:22px;height:14px;flex:none;border:1px solid #8B6F45}
  .dotmark{width:9px;height:9px;flex:none;border-radius:999px;background:#3E3323;margin:0 6.5px}

const SLOTS = [

/* 国旗（訪れた国） */
const FLAGS = [
  ['jp','日本','Japan'], ['kr','韓国','South Korea'], ['tw','台湾','Taiwan'], ['cn','中国','China'],
  ['th','タイ','Thailand'], ['sg','シンガポール','Singapore'], ['it','イタリア','Italy'],

const flagBox = document.getElementById('flags');
FLAGS.forEach(([code, ja, key]) => {

  b.className = 'flagbtn';

    hideTip();
    if (key === 'Japan') return toJapan();

function showTip(text, ev) {
  const r = sheet.getBoundingClientRect();
  const s = r.width / 1500;
  tip.textContent = text;
  tip.style.left = ((ev.clientX - r.left) / s) + 'px';
  tip.style.top = ((ev.clientY - r.top) / s) + 'px';
  tip.style.opacity = '1';
}
const hideTip = () => { tip.style.opacity = '0'; };

function openPop(kicker, title, meta) {
  document.getElementById('popKicker').textContent = kicker;
  document.getElementById('popTitle').textContent = title;
  const box = document.getElementById('popMeta');
  box.innerHTML = '';
  (meta || []).forEach(m => { const s = document.createElement('span'); s.textContent = m; box.appendChild(s); });
  pop.classList.add('on');
}
document.getElementById('popClose').onclick = () => pop.classList.remove('on');
pop.addEventListener('click', e => { if (e.target === pop) pop.classList.remove('on'); });

/* 方位磁針 */
function compass(g, cx, cy, r) {
  const c = g.append('g').attr('transform', 'translate(' + cx + ',' + cy + ')').attr('pointer-events', 'none');
  c.append('circle').attr('r', r).attr('fill', 'none').attr('stroke', '#7A6238').attr('stroke-width', 1).attr('opacity', .8);
  c.append('circle').attr('r', r * .74).attr('fill', 'none').attr('stroke', '#7A6238').attr('stroke-width', .6).attr('opacity', .6);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, L = i % 2 ? r * .46 : r * .72, w = i % 2 ? r * .1 : r * .16;
    const px = Math.sin(a) * L, py = -Math.cos(a) * L;
    const qx = Math.cos(a) * w, qy = Math.sin(a) * w;
    c.append('path').attr('d', 'M0 0 L' + (qx) + ' ' + (qy) + ' L' + px + ' ' + py + ' Z')
      .attr('fill', i % 2 ? '#B9A57F' : '#6E5535').attr('opacity', i % 2 ? .8 : .92);
    c.append('path').attr('d', 'M0 0 L' + (-qx) + ' ' + (-qy) + ' L' + px + ' ' + py + ' Z')
      .attr('fill', i % 2 ? '#8B6F45' : '#3E3323').attr('opacity', i % 2 ? .7 : .9);
  }
  c.append('circle').attr('r', r * .1).attr('fill', '#F0E4C6').attr('stroke', '#6E5535');
  const lab = [['N', 0, -r - 12], ['E', r + 12, 5], ['S', 0, r + 18], ['W', -r - 12, 5]];
  lab.forEach(([t, x, y]) => c.append('text').attr('x', x).attr('y', y).attr('text-anchor', 'middle')
    .attr('font-family', "'IM Fell English SC',serif").attr('font-size', 17).attr('fill', '#3B2C18').text(t));
}

function ship(g, x, y, s) {
  const c = g.append('g').attr('transform', 'translate(' + x + ',' + y + ') scale(' + s + ')').attr('pointer-events', 'none');
  const ink = '#6E5535', deep = '#5A4626', cloth = '#B4573F';
  const L = (d, w, o) => c.append('path').attr('d', d).attr('fill', 'none').attr('stroke', deep)
    .attr('stroke-width', w || 1).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round').attr('opacity', o == null ? .95 : o);

  // 中国式のジャンク船 — バテン入りの帆
  function sail(mx, top, bot, wl, wr, lean) {
    const x1 = mx - wl, x2 = mx + wr;
    c.append('path')
      .attr('d', 'M' + (x1 + lean) + ' ' + top + ' L' + x2 + ' ' + (top + 2) + ' L' + (x2 - 1) + ' ' + bot + ' L' + x1 + ' ' + (bot - 1) + ' Z')
      .attr('fill', cloth).attr('fill-opacity', .5).attr('stroke', deep).attr('stroke-width', .9).attr('stroke-linejoin', 'round');
    const n = Math.max(3, Math.round((bot - top) / 3.4));
    for (let i = 1; i < n; i++) {
      const k = i / n, ya = top + (bot - top) * k;
      L('M' + (x1 + lean * (1 - k)) + ' ' + ya + ' L' + (x2 - k) + ' ' + (ya + 2 * (1 - k)), .55, .7);
    }
  }

  sail(-12, -22, -6, 5, 6, 1.5);   // 前帆
  sail(1, -32, -7, 7, 9, 2);       // 主帆
  sail(15, -19, -6, 4.5, 5.5, 1.2);// 後帆

  L('M-12 -3 V-24', .9); L('M1 -3 V-35', 1); L('M15 -3 V-21', .9);   // マスト
  L('M1 -35 l6 2.5 l-6 2.5', .8);                                     // 旗

  // 船体
  c.append('path')
    .attr('d', 'M-24 -3 C-22 6 -14 11 -2 11 L14 11 C20 11 23 8 24 3 L25 -6 L18 -3 Z')
    .attr('fill', ink).attr('fill-opacity', .22).attr('stroke', deep).attr('stroke-width', 1.1).attr('stroke-linejoin', 'round');
  L('M-22 -3 L20 -3', .8, .8);                                        // 舷側ライン
  L('M-20 0 L18 0', .5, .55);
  for (let i = -18; i <= 14; i += 4) L('M' + i + ' -3 v-2.6', .55, .7); // 手すり
  c.append('path').attr('d', 'M14 -3 L24 -3 L25 -11 L15 -11 Z')
    .attr('fill', ink).attr('fill-opacity', .3).attr('stroke', deep).attr('stroke-width', .9);  // 船尾楼
  L('M-24 -3 L-30 -7', .9);                                           // 舳先の突き出し

  // 波
  L('M-32 13 c5 -3.5 9 3.5 14 0 M6 15 c5 -3.5 9 3.5 14 0 M-14 17 c5 -3.5 9 3.5 14 0', .7, .55);
  c.attr('opacity', .88);
}

const svg = d3.select('#map');
const gWorld = svg.append('g');
const gJapan = svg.append('g').style('display', 'none');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const countries = topojson.feature(topo, topo.objects.countries).features;
  const proj = d3.geoNaturalEarth1().fitExtent([[262, 168], [1238, 806]], { type: 'Sphere' });
  const path = d3.geoPath(proj);

  gWorld.append('path').attr('class', 'sphere').attr('d', path({ type: 'Sphere' }));
  gWorld.append('path').attr('class', 'grat').attr('d', path(d3.geoGraticule10()));

  gWorld.append('g').selectAll('path').data(countries).join('path')
    .attr('d', path)
    .attr('class', d => COUNTRIES[d.properties.name] ? 'land vis' : 'land')
    .style('fill', d => { const c = COUNTRIES[d.properties.name]; return c ? c.tint : null; })
    .style('fill-opacity', d => COUNTRIES[d.properties.name] ? .88 : null)
    .on('mousemove', (ev, d) => { const c = COUNTRIES[d.properties.name]; if (c) showTip(c.ja, ev); else if (d.properties.name === 'Japan') showTip('日本 — クリックで国内地図へ', ev); })
    .on('mouseleave', hideTip)
    .on('click', (ev, d) => {
      const n = d.properties.name;
      if (n === 'Japan') return toJapan();
      if (COUNTRIES[n]) openPop("PLACES I'VE BEEN", COUNTRIES[n].ja, COUNTRIES[n].meta);
    });

  /* 日本は薄く色を置いて「クリックできる」ことを示す */
  gWorld.selectAll('path').filter(d => d && d.properties && d.properties.name === 'Japan')
    .style('fill', '#D6C39A').style('fill-opacity', .95).style('cursor', 'pointer');

  /* 国名ラベル — ラベル自体がクリック領域（すべての国） */
  const glab = gWorld.append('g');
  function drawLabel(d, en, ja, f, onClick) {
    const cen = path.centroid(d);
    if (!cen || isNaN(cen[0])) return;
    const x = cen[0] + (f.dx || 0), y = cen[1] + (f.dy || 0);
    if (f.lead) {
      const ex = x + (f.anchor === 'end' ? 6 : -6);
      glab.append('path').attr('d', 'M' + cen[0] + ' ' + cen[1] + ' L' + ex + ' ' + (y - 4))
        .attr('fill', 'none').attr('stroke', '#7A6238').attr('stroke-width', .7).attr('opacity', .65)
        .attr('pointer-events', 'none');
      glab.append('circle').attr('cx', cen[0]).attr('cy', cen[1]).attr('r', 1.8).attr('fill', '#5A4626')
        .attr('pointer-events', 'none');
    }
    const t = glab.append('text').attr('class', 'clab' + (f.cls ? ' ' + f.cls : '')).attr('x', x).attr('y', y)
      .attr('text-anchor', f.anchor || 'middle');
    if (f.two) { f.two.forEach((line, i) => t.append('tspan').attr('x', x).attr('dy', i ? 14 : 0).text(line)); }
    else t.text(en);
    const b = t.node().getBBox();
    glab.insert('rect', () => t.node())
      .attr('x', b.x - 8).attr('y', b.y - 7).attr('width', b.width + 16).attr('height', b.height + 14)
      .attr('fill', 'transparent').style('cursor', 'pointer')
      .on('mousemove', ev => showTip(ja, ev)).on('mouseleave', hideTip)
      .on('click', onClick);
  }
  countries.forEach(d => {
    const n = d.properties.name;
    const c = COUNTRIES[n];
    if (c) drawLabel(d, c.en, c.ja, LABEL_FIX[n] || {}, () => openPop("PLACES I'VE BEEN", c.ja, c.meta));
    else if (n === 'Japan') drawLabel(d, 'JAPAN', '日本 — クリックで国内地図へ', LABEL_FIX.Japan, () => toJapan());
  });
  /* 面のない国 — 国名ラベルもクリック領域にする */
  Object.keys(NO_POLY).forEach(k => {
    const p = proj(NO_POLY[k]);
    const c = COUNTRIES[k];
    gWorld.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 4.5)
      .style('fill', c.tint).attr('stroke', '#6E5535').style('cursor', 'pointer')
      .on('mousemove', ev => showTip(c.ja, ev)).on('mouseleave', hideTip)
      .on('click', () => openPop("PLACES I'VE BEEN", c.ja, c.meta));
    const f = LABEL_FIX[k] || {};
    const x = p[0] + (f.dx || 0), y = p[1] + (f.dy || 0);
    const t = glab.append('text').attr('class', 'clab' + (f.cls ? ' ' + f.cls : '')).attr('x', x).attr('y', y)
      .attr('text-anchor', f.anchor || 'middle').text(c.en);
    const b = t.node().getBBox();
    glab.insert('rect', () => t.node())
      .attr('x', b.x - 8).attr('y', b.y - 7).attr('width', b.width + 16).attr('height', b.height + 14)
      .attr('fill', 'transparent').style('cursor', 'pointer')
      .on('mousemove', ev => showTip(c.ja, ev)).on('mouseleave', hideTip)
      .on('click', () => openPop("PLACES I'VE BEEN", c.ja, c.meta));
  });

  /* 都市 */
  const gc = gWorld.append('g');
  CITIES.forEach(c => {
    const p = proj([c.lon, c.lat]);
    if (!p) return;
    gc.append('circle').attr('class', 'city').attr('cx', p[0]).attr('cy', p[1]).attr('r', 3.4)
      .on('mousemove', ev => showTip(c.ja, ev)).on('mouseleave', hideTip)
      .on('click', () => { const o = COUNTRIES[c.c]; if (o) openPop("PLACES I'VE BEEN", o.ja, o.meta); });
    if (!c.nolabel) gc.append('text').attr('class', 'citylab').attr('x', p[0] + (c.dx || 0)).attr('y', p[1] + (c.dy || 0))
      .attr('text-anchor', c.anchor || 'start').text(c.n);
  });

  const shipB = proj([72, -26]);
  ship(gWorld, shipB[0], shipB[1], 1.15);

  /* 小さい国はクリック範囲を広げる */
  const gHit = gWorld.append('g');
  countries.forEach(d => {
    const c = COUNTRIES[d.properties.name];
    if (!c) return;
    if (path.area(d) > 320) return;
    if ((LABEL_FIX[d.properties.name] || {}).lead) return;   // ラベルがクリック領域
    const cen = path.centroid(d);
    if (!cen || isNaN(cen[0])) return;
    gHit.append('circle').attr('cx', cen[0]).attr('cy', cen[1]).attr('r', 11)
      .attr('fill', 'transparent').style('cursor', 'pointer')
      .on('mousemove', ev => showTip(c.ja, ev)).on('mouseleave', hideTip)
      .on('click', () => openPop("PLACES I'VE BEEN", c.ja, c.meta));
  });
  Object.keys(NO_POLY).forEach(k => {
    const p = proj(NO_POLY[k]);
    gHit.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 15)
      .attr('fill', 'transparent').style('cursor', 'pointer')
      .on('mousemove', ev => showTip(COUNTRIES[k].ja, ev)).on('mouseleave', hideTip)
      .on('click', () => openPop("PLACES I'VE BEEN", COUNTRIES[k].ja, COUNTRIES[k].meta));
  });

  compass(gWorld, proj([-24, -34])[0], proj([-24, -34])[1], 33);

  /* ---------- 日本（国内）ビュー ---------- */
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json').then(fine => {
    const jp = topojson.feature(fine, fine.objects.countries).features.find(d => d.properties.name === 'Japan');
    const jproj = d3.geoMercator().fitExtent([[430, 150], [1290, 830]], { type: 'MultiPoint', coordinates: [[128.2, 30.4], [146.3, 45.8]] });
    const jpath = d3.geoPath(jproj);
    const gCoast = gJapan.append('g');
    gCoast.append('path').attr('d', jpath(jp)).attr('class', 'land');

    /* 県境（実データ）— 取得できたときだけ点線で重ねる */
    d3.json('https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.topojson').then(jt => {
      const key = Object.keys(jt.objects)[0];
      const prefs = topojson.feature(jt, jt.objects[key]);
      const visited = {};
      PREFS.forEach(([n, , , v]) => { if (v) visited[n] = 1; });
      const gp = gJapan.insert('g', ':first-child');
      gp.selectAll('path').data(prefs.features).join('path')
        .attr('d', jpath)
        .attr('class', 'prefArea')
        .style('fill', d => visited[d.properties.nam_ja] ? '#DEC6A0' : '#E6D3A8');
      gCoast.raise();
      gCoast.select('path').style('fill', 'none').style('stroke-width', .9);
      gJapan.selectAll('.prefDot, .prefLabel').raise();
    }).catch(() => {});
    gJapan.append('text').attr('x', 300).attr('y', 240).attr('class', 'clab').attr('text-anchor', 'start')
      .attr('font-size', 26).text('JAPAN');
    gJapan.append('text').attr('x', 300).attr('y', 276).attr('text-anchor', 'start')
      .attr('font-family', "'Shippori Mincho B1',serif").attr('font-size', 15).attr('fill', '#6B573A')
      .text('訪れた都道府県 ' + PREFS.filter(p => p[3]).length + ' / 47');

    /* 沖縄インセット（左上・天気予報のかたち） */
    const OKI = { x: 470, y: 172, w: 212, h: 132 };
    const oproj = d3.geoMercator().fitExtent(
      [[OKI.x + 14, OKI.y + 32], [OKI.x + OKI.w - 14, OKI.y + OKI.h - 14]],
      { type: 'MultiPoint', coordinates: [[126.2, 25.8], [128.6, 26.95]] });
    svg.append('clipPath').attr('id', 'clipOki').append('rect')
      .attr('x', OKI.x).attr('y', OKI.y).attr('width', OKI.w).attr('height', OKI.h);
    const gOki = gJapan.append('g');
    gOki.append('rect').attr('x', OKI.x).attr('y', OKI.y).attr('width', OKI.w).attr('height', OKI.h)
      .attr('fill', 'rgba(247,238,213,.5)').attr('stroke', '#8B6F45').attr('stroke-width', 1)
      .attr('stroke-dasharray', '4 3');
    gOki.append('g').attr('clip-path', 'url(#clipOki)').append('path')
      .attr('d', d3.geoPath(oproj)(jp)).attr('class', 'land');
    gOki.append('text').attr('x', OKI.x + 12).attr('y', OKI.y + 22)
      .attr('font-family', "'Cormorant Garamond',serif").attr('font-weight', 600).attr('font-size', 13)
      .attr('letter-spacing', '.2em').attr('fill', '#5A4626').text('OKINAWA');
    gOki.append('text').attr('x', OKI.x + OKI.w - 12).attr('y', OKI.y + 22).attr('text-anchor', 'end')
      .attr('font-family', "'Shippori Mincho B1',serif").attr('font-size', 11).attr('fill', '#6B573A').text('沖縄');

    PREFS.forEach(([name, lat, lon, v]) => {
      const oki = name === '沖縄県';
      const p = (oki ? oproj : jproj)([lon, lat]);
      if (!p) return;
      const c = (oki ? gOki : gJapan).append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', v ? 5 : 2.8)
        .attr('class', (v ? 'pref' : 'prefOff') + ' prefDot');
      if (v) c.style('cursor', 'pointer')
        .on('mousemove', ev => showTip(name, ev)).on('mouseleave', hideTip)
        .on('click', () => openPop('JAPAN — 訪れた都道府県', name, []));
    });
    compass(gJapan, 330, 700, 33);
  });
});

function toJapan() {
  hideTip();
  gWorld.style('display', 'none');
  gJapan.style('display', null);
  document.getElementById('slots').style.display = 'none';
  document.getElementById('flags').style.display = 'none';
  document.getElementById('backBtn').style.display = 'inline-flex';
  document.getElementById('hint').textContent = 'CLICK A PREFECTURE';
}
function toWorld() {
  hideTip();
  gJapan.style('display', 'none');
  gWorld.style('display', null);
  document.getElementById('slots').style.display = '';
  document.getElementById('flags').style.display = '';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('hint').textContent = 'CLICK A COUNTRY OR FLAG';
}
document.getElementById('backBtn').onclick = toWorld;

/* ---------- スケーリング & 高さ通知 ---------- */
const wrap = document.getElementById('stagewrap');
function fit() {
  const s = wrap.clientWidth / 1500;
  sheet.style.transform = 'scale(' + s + ')';
  wrap.style.height = Math.round(1000 * s) + 'px';
}
addEventListener('resize', fit);
fit();

(function () {
  let last = 0;
  function report(force) {
    const h = Math.ceil(wrap.getBoundingClientRect().height);
    if (!force && Math.abs(h - last) < 4) return;
    last = h;
    try { parent.postMessage({ type: 'hobbyFrameHeight', h: h }, '*'); } catch (e) {}
  }
  addEventListener('load', () => report(true));
  // 350ms間隔のポーリングをやめ、wrap要素の実際のサイズ変化を検知したときだけ
  // report()を呼ぶようResizeObserverに置き換える（常時CPUを使うポーリングを廃止）。
  // 高さの計算方法・親への通知内容（postMessage）は一切変更しない。
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => report());
    ro.observe(wrap);
  } else {
    // ResizeObserver未対応ブラウザ向けフォールバック（従来のポーリング）
    setInterval(report, 350);
  }
})();
</script>
