<style>

  .pop.on{display:flex}

</div>

function showTip(t, ev) {
  const r = stage.getBoundingClientRect();
  tip.textContent = t;
  tip.style.left = (ev.clientX - r.left) + 'px';
  tip.style.top = (ev.clientY - r.top) + 'px';
  tip.style.opacity = '1';
}
const hideTip = () => tip.style.opacity = '0';
document.getElementById('popClose').onclick = () => pop.classList.remove('on');
pop.addEventListener('click', e => { if (e.target === pop) pop.classList.remove('on'); });
function syncPop() {
  const v = cur ? visited.has(cur) : false;
  const st = document.getElementById('popState');
  st.textContent = v ? '訪問済み' : '未訪問';
  st.className = 'state' + (v ? ' on' : '');
}
function openPop(kicker, name, pref) {
  cur = name;
  document.getElementById('popKicker').textContent = kicker;
  document.getElementById('popTitle').textContent = name;
  document.getElementById('popPref').textContent = pref;
  syncPop();
  pop.classList.add('on');
}

  svg.append('g').attr('clip-path', 'url(#clipMain)').append('path')
    .attr('d', d3.geoPath(proj)(jp)).attr('fill', '#E9E4D4').attr('stroke', '#FFFDF5').attr('stroke-width', .8);

  /* 沖縄インセット */
  const oproj = d3.geoMercator().fitExtent([[INSET.x + 8, INSET.y + 8], [INSET.x + INSET.w - 8, INSET.y + INSET.h - 8]], BOX_OKI);
  svg.append('clipPath').attr('id', 'clipOki').append('rect')
    .attr('x', INSET.x).attr('y', INSET.y).attr('width', INSET.w).attr('height', INSET.h);
  svg.append('rect').attr('x', INSET.x).attr('y', INSET.y).attr('width', INSET.w).attr('height', INSET.h)
    .attr('fill', 'rgba(255,253,245,.5)').attr('stroke', 'rgba(21,21,21,.2)').attr('stroke-dasharray', '3 3');
  svg.append('g').attr('clip-path', 'url(#clipOki)').append('path')
    .attr('d', d3.geoPath(oproj)(jp)).attr('fill', '#E9E4D4').attr('stroke', '#FFFDF5').attr('stroke-width', .8);
  svg.append('text').attr('x', INSET.x + 9).attr('y', INSET.y + 18)
    .attr('font-family', "'IBM Plex Mono',monospace").attr('font-size', 9).attr('letter-spacing', '.14em')
    .attr('fill', 'rgba(21,21,21,.5)').text('OKINAWA');

  const layer = svg.append('g');
  function draw() {
    layer.selectAll('*').remove();
    const boxes = [];
    function placeLabel(x, y, name) {
      const w = name.length * 6.4 + 4, h = 11;
      for (const dy of [0, -11, 11, -22, 22, -33, 33]) {
        const b = [x, y + dy - h / 2, x + w, y + dy + h / 2];
        if (!boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) { boxes.push(b); return dy; }
      }
      return 0;
    }
    const sets = [];
    if (mode === 'all' || mode === 'a') sets.push(['日本100名城', A, '#3B82C4']);
    if (mode === 'all' || mode === 'b') sets.push(['続日本100名城', B, '#D9B979']);
    sets.forEach(([label, data, color]) => {
      data.forEach(([name, pref, lat, lon]) => {
        const v = visited.has(name);
        if (vmode === 'v' && !v) return;
        if (vmode === 'n' && v) return;
        const p = (pref === '沖縄県' ? oproj : proj)([lon, lat]);
        if (!p) return;
        const g = layer.append('g').attr('class', 'pin')
          .on('mousemove', ev => showTip(name + ' — ' + pref + (v ? ' / 訪問済み' : ''), ev))
          .on('mouseleave', hideTip)
          .on('click', () => openPop(label + (v ? ' — 訪問済み' : ''), name, pref));
        if (v) {
          g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 9.5)
            .attr('fill', 'none').attr('stroke', color).attr('stroke-width', 1).attr('opacity', .45);
          g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 5.6)
            .attr('fill', color).attr('stroke', '#151515').attr('stroke-width', 1.7);

        } else {
          g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 3.5)
            .attr('fill', '#FFFDF5').attr('stroke', color).attr('stroke-width', 1.5).attr('opacity', .92);
        }
      });
    });
    const va = A.filter(c => visited.has(c[0])).length, vb = B.filter(c => visited.has(c[0])).length;
    const stat = (k, v, sub) => '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><span style="font-size:12px;color:rgba(21,21,21,.68)">' + k + '</span><span class="mono" style="font-size:15px;color:#151515">' + v + (sub ? '<span style="font-size:12px;color:rgba(21,21,21,.45)"> / ' + sub + '</span>' : '') + '</span></div>';
    document.getElementById('panelStats').innerHTML =
      stat('日本100名城', va, A.length) + stat('続日本100名城', vb, B.length) + stat('訪問済み合計', va + vb, A.length + B.length);
  }
  redraw = draw;
  draw();
  document.querySelectorAll('#stabs .tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('#stabs .tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.set;
    draw();
  });
  document.querySelectorAll('#vtabs .tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('#vtabs .tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    vmode = b.dataset.v;
    draw();
  });
});
</script>

<script>
(function () {
  var last = 0;
  function measure() {
    var w = document.querySelector('.wrap');
    if (!w) return Math.ceil(document.body.scrollHeight);
    var r = w.getBoundingClientRect();
    return Math.ceil(r.height + r.top + 8);
  }
  function report(force) {
    var h = measure();
    if (!force && Math.abs(h - last) < 4) return;
    last = h;
    try { parent.postMessage({ type: 'hobbyFrameHeight', h: h }, '*'); } catch (e) {}
  }
  window.addEventListener('load', function () { report(true); });
  // 350ms間隔のポーリングをやめ、.wrap要素の実際のサイズ変化を検知したときだけ
  // report()を呼ぶようResizeObserverに置き換える（常時CPUを使うポーリングを廃止）。
  // 高さの計算方法・親への通知内容（postMessage）は一切変更しない。
  var wrapEl = document.querySelector('.wrap');
  if (wrapEl && window.ResizeObserver) {
    var ro = new ResizeObserver(function () { report(); });
    ro.observe(wrapEl);
  } else {
    // ResizeObserver未対応ブラウザ向けフォールバック（従来のポーリング）
    setInterval(report, 350);
  }
})();
</script>
