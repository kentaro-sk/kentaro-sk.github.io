name: サイトの静的チェック

# PR必須化(2026-09-17)により、mainへのマージ前にこのチェックを必須ステータスとして
# ブロックできるよう pull_request でも実行する。push:main は、保護ルールをすり抜けて
# 直接pushされた場合の保険として残している。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # gitleaksでGit履歴全体をスキャンするため、全履歴を取得する
          fetch-depth: 0

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          # html-validate等の一部devDependenciesがNode 22+を要求するため、
          # ローカル開発環境(Node 24)に合わせている。
          node-version: 24
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: シークレットスキャン（gitleaks・Git履歴全体・検出時は失敗）
        # 公開リポジトリでは漏洩が即事故になるため、他のチェックより先に実行する。
        # 公式Actionではなくリリースバイナリを直接取得する（Actionのライセンス条件・
        # Nodeバージョン依存を避け、版を固定して再現性を保つため）。
        # 検出値は --redact で伏せ字にしてログに残さない。
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner -v .
          rm -f gitleaks gitleaks.tar.gz

      - name: HTML構文チェック（html-validate）
        run: npm run check:html

      - name: リンク切れ・画像パス切れチェック（linkinator）
        run: npm run check:links

      - name: CSS構文チェック（stylelint）
        run: npm run check:css

      - name: 画像サイズチェック（1MB超は警告のみ）
        run: npm run check:images

      - name: アクセシビリティチェック（pa11y, WCAG2AA・警告のみ）
        run: npm run check:a11y

      - name: Lighthouse CI（パフォーマンス/SEO等のスコア計測・警告のみ）
        # 閾値未達はlighthouserc.json側で"warn"設定済みだが、初回導入のため
        # ステップ自体が予期せず失敗してもジョブ全体は止めない保険としてcontinue-on-errorも付ける。
        run: npm run check:lighthouse
        continue-on-error: true

      - name: Lighthouseレポートをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
          # .lighthouseciはドット始まり(隠しディレクトリ)のため、
          # デフォルト(false)だと中身が除外されてしまう
          include-hidden-files: true
