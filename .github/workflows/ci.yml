name: サイトの静的チェック

# PR必須化(2026-09-17)により、mainへのマージ前にこのチェックを必須ステータスとして
# ブロックできるよう pull_request でも実行する。push:main は、保護ルールをすり抜けて
# 直接pushされた場合の保険として残している。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: HTML構文チェック（html-validate）
        run: npm run check:html

      - name: リンク切れ・画像パス切れチェック（linkinator）
        run: npm run check:links

      - name: CSS構文チェック（stylelint）
        run: npm run check:css

      - name: 画像サイズチェック（1MB超は警告のみ）
        run: npm run check:images

      - name: アクセシビリティチェック（pa11y, WCAG2AA・警告のみ）
        run: npm run check:a11y

      - name: Lighthouse CI（パフォーマンス/SEO等のスコア計測・警告のみ）
        # 閾値未達はlighthouserc.json側で"warn"設定済みだが、初回導入のため
        # ステップ自体が予期せず失敗してもジョブ全体は止めない保険としてcontinue-on-errorも付ける。
        run: npm run check:lighthouse
        continue-on-error: true
